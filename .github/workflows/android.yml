name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # PYTHON
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: pip install pillow

      # ANDROID SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK Packages
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # FIX SDK STRUCTURE
      - name: Fix Android SDK Structure
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "SDKMANAGER NOT FOUND"
            exit 1
          fi

          mkdir -p "$ANDROID_HOME/bin"

          ln -sf "$SDKMANAGER" "$ANDROID_HOME/bin/sdkmanager"

      # INSTALL BUBBLEWRAP
      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      # BUBBLEWRAP CONFIG
      - name: Bubblewrap config
        run: |
          mkdir -p ~/.bubblewrap

          cat > ~/.bubblewrap/config.json <<EOF
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$ANDROID_HOME"
          }
          EOF

      # FIX MIN SDK VERSION
      - name: Fix Minimum Android Version
        run: |
          python3 - <<'PY'
          import json

          path = "twa-manifest.json"

          with open(path, "r") as f:
              config = json.load(f)

          print("Old minSdkVersion:", config.get("minSdkVersion"))

          config["minSdkVersion"] = 24

          with open(path, "w") as f:
              json.dump(config, f, indent=2)

          print("New minSdkVersion:", config["minSdkVersion"])
          PY

      # GENERATE ANDROID PROJECT
      - name: Update Bubblewrap Project
        run: |
          bubblewrap update --skipVersionUpgrade

      # INSTALL KARAJOY APP ICON
      - name: Install Karajoy Application Icon
        run: |
          if [ ! -f "karajoy-app-icon.png" ]; then
            echo "ERROR: ICON NOT FOUND"
            exit 1
          fi

          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          import xml.etree.ElementTree as ET

          source = Path("karajoy-app-icon.png")
          res = Path("app/src/main/res")
          manifest = Path("app/src/main/AndroidManifest.xml")

          if not manifest.exists():
              raise SystemExit("AndroidManifest.xml NOT FOUND")

          image = Image.open(source).convert("RGBA")

          # CROP SQUARE
          side = min(image.size)
          left = (image.width - side) // 2
          top = (image.height - side) // 2

          image = image.crop(
              (left, top, left + side, top + side)
          )

          # GENERATE ICON DENSITIES
          densities = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192
          }

          for folder, size in densities.items():
              directory = res / folder
              directory.mkdir(parents=True, exist_ok=True)

              icon = image.resize(
                  (size, size),
                  Image.Resampling.LANCZOS
              )

              icon.save(directory / "ic_launcher.png")
              icon.save(directory / "ic_launcher_round.png")

          # ADAPTIVE ICON FOREGROUND
          drawable = res / "drawable"
          drawable.mkdir(parents=True, exist_ok=True)

          canvas = Image.new(
              "RGBA", (432, 432), (8, 6, 4, 255)
          )

          foreground = image.resize(
              (320, 320),
              Image.Resampling.LANCZOS
          )

          canvas.alpha_composite(
              foreground,
              (56, 56)
          )

          canvas.save(
              drawable / "ic_launcher_foreground.png"
          )

          # ADAPTIVE ICON BACKGROUND
          values = res / "values"
          values.mkdir(parents=True, exist_ok=True)

          (values / "ic_launcher_background.xml").write_text(
              '<?xml version="1.0" encoding="utf-8"?>\n'
              '<resources>\n'
              '  <color name="ic_launcher_background">#080604</color>\n'
              '</resources>\n',
              encoding="utf-8"
          )

          # ADAPTIVE ICON XML
          adaptive = res / "mipmap-anydpi-v26"
          adaptive.mkdir(parents=True, exist_ok=True)

          adaptive_xml = (
              '<?xml version="1.0" encoding="utf-8"?>\n'
              '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n'
              '  <background android:drawable="@color/ic_launcher_background" />\n'
              '  <foreground android:drawable="@drawable/ic_launcher_foreground" />\n'
              '</adaptive-icon>\n'
          )

          (adaptive / "ic_launcher.xml").write_text(adaptive_xml)
          (adaptive / "ic_launcher_round.xml").write_text(adaptive_xml)

          # SET ANDROID APPLICATION ICON
          ET.register_namespace(
              "android",
              "http://schemas.android.com/apk/res/android"
          )

          tree = ET.parse(manifest)
          root = tree.getroot()

          android = "{http://schemas.android.com/apk/res/android}"
          application = root.find("application")

          if application is None:
              raise SystemExit("APPLICATION TAG NOT FOUND")

          application.set(
              android + "icon",
              "@mipmap/ic_launcher"
          )

          application.set(
              android + "roundIcon",
              "@mipmap/ic_launcher_round"
          )

          tree.write(
              manifest,
              encoding="utf-8",
              xml_declaration=True
          )

          print("KARAJOY ICON INSTALLED SUCCESSFULLY!")
          PY

      # BUILD UNSIGNED APK
      - name: Build APK
        run: |
          set -o pipefail

          bubblewrap build --skipPwaValidation --skipSigning 2>&1 | tee build.log

      # FIND APK
      - name: Locate APK
        run: |
          APK=$(find . -type f -name '*.apk' \
            ! -path '*/intermediates/*' | head -n 1)

          if [ -z "$APK" ]; then
            echo "APK NOT FOUND"
            exit 1
          fi

          echo "APK FOUND: $APK"
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      # SIGN APK
      - name: Sign Android APK
        run: |
          set -euo pipefail

          # TEMPORARY KEY FOR INSTALLATION TEST
          KS_PASS=$(openssl rand -hex 24)

          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/karajoy.keystore" \
            -storepass "$KS_PASS" \
            -alias karajoy \
            -keypass "$KS_PASS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Karajoy POS, O=Karajoy, C=ID"

          # ALIGN APK
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" \
            -f -p 4 \
            "$APK_PATH" \
            "$RUNNER_TEMP/karajoy-aligned.apk"

          # SIGN APK
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/karajoy.keystore" \
            --ks-key-alias karajoy \
            --ks-pass env:KS_PASS \
            --key-pass env:KS_PASS \
            --out karajoy-pos.apk \
            "$RUNNER_TEMP/karajoy-aligned.apk"

          # VERIFY SIGNATURE
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify \
            --verbose \
            karajoy-pos.apk

          echo "APK SIGNED SUCCESSFULLY!"

        env:
          KS_PASS: ${{ secrets.KARAJOY_KEY_PASSWORD }}

      # NOTE: TEMP KEY PASSWORD HANDLING
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn

      # UPLOAD SIGNED APK
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: karajoy-pos-apk
          path: karajoy-pos.apk
          if-no-files-found: error
