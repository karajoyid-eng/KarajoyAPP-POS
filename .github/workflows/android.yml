name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # SETUP ANDROID SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Packages
        run: |
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses

      # INSTALL BUBBLEWRAP
      - name: Install Bubblewrap
        run: npm i -g @bubblewrap/cli

      # BUBBLEWRAP CONFIG
      - name: Bubblewrap config
        run: |
          mkdir -p ~/.bubblewrap

          echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"$ANDROID_HOME\"}" > ~/.bubblewrap/config.json

          echo "JAVA HOME: $JAVA_HOME"
          echo "ANDROID HOME: $ANDROID_HOME"

          ls -la "$ANDROID_HOME"

      # BUILD APK
      - name: Build APK
        run: |
          set -o pipefail
          bubblewrap update --skipVersionUpgrade || true
          bubblewrap build --skipPwaValidation --skipSigning 2>&1 | tee build.log

      # UPLOAD BUILD LOG
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      # UPLOAD APK
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: karajoy-pos-apk
          path: app-release-unsigned.apk
