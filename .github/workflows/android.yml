name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Bubblewrap
        run: npm i -g @bubblewrap/cli

      - name: Bubblewrap config
        run: |
          mkdir -p ~/.bubblewrap
          echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"$ANDROID_HOME\"}" > ~/.bubblewrap/config.json

      - name: Fix SDK layout
        run: ln -sfn $ANDROID_HOME/cmdline-tools/latest/bin $ANDROID_HOME/bin

      - name: Build APK
        run: |
          set -o pipefail
          bubblewrap update --skipVersionUpgrade || true
          bubblewrap build --skipPwaValidation --skipSigning 2>&1 | tee build.log

      - name: Show error cause
        if: failure()
        run: |
          grep -n -A 25 "What went wrong" build.log || true
          grep -n -B 2 -A 10 "FAILURE" build.log || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: karajoy-pos-apk
          path: app-release-unsigned.apk
