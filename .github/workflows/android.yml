name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Bubblewrap
        run: npm i -g @bubblewrap/cli

      - name: Bubblewrap config
        run: |
          mkdir -p ~/.bubblewrap
          echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"$ANDROID_HOME\"}" > ~/.bubblewrap/config.json

      - name: Fix SDK layout
        run: ln -sfn $ANDROID_HOME/cmdline-tools/latest/bin $ANDROID_HOME/bin

      - name: Build APK
        run: |
          bubblewrap update --skipVersionUpgrade || true
          bubblewrap build --skipPwaValidation --skipSigning

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: karajoy-pos-apk
          path: app-release-unsigned.apk
